// AI pack module generated by tools/play_ai_pack/make_ai_pack.py.
// AI packs hold models only (no code); the app loads them through the Play AI Delivery API.
plugins {
    id 'com.android.ai-pack'
}

aiPack {
    packName = "{{PACK_NAME}}" // must equal this directory's name
    dynamicDelivery {
        deliveryType = "{{DELIVERY}}"
    }
}
