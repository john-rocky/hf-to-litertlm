// Host app generated by tools/play_ai_pack/make_ai_pack.py for {{REPO}}.
plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
}

android {
    namespace '{{APPLICATION_ID}}'
    compileSdk {{COMPILE_SDK}}

    defaultConfig {
        applicationId "{{APPLICATION_ID}}"
        minSdk {{MIN_SDK}}
        targetSdk {{TARGET_SDK}}
        versionCode 1
        versionName "0.1"
    }

    // Every AI pack in the project is listed here.
    assetPacks = [":{{PACK_NAME}}"]

{{DEVICE_TARGETING_BLOCK}}
    // Upload signing for Play: set PLAY_UPLOAD_KEYSTORE / _STORE_PASS / _ALIAS / _KEY_PASS in the
    // environment. Without them `bundleRelease` produces an unsigned .aab, which bundletool can
    // still turn into locally testable APKs (it signs with a debug key).
    signingConfigs {
        upload {
            def ks = System.getenv("PLAY_UPLOAD_KEYSTORE")
            if (ks != null) {
                storeFile file(ks)
                storePassword System.getenv("PLAY_UPLOAD_STORE_PASS")
                keyAlias System.getenv("PLAY_UPLOAD_ALIAS")
                keyPassword System.getenv("PLAY_UPLOAD_KEY_PASS")
            }
        }
    }
    buildTypes {
        release {
            minifyEnabled false
            if (System.getenv("PLAY_UPLOAD_KEYSTORE") != null) {
                signingConfig signingConfigs.upload
            }
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    kotlinOptions { jvmTarget = "17" }
}

dependencies {
    implementation "com.google.ai.edge.litertlm:litertlm-android:{{LITERTLM_ANDROID}}"
    implementation "com.google.android.play:ai-delivery:{{AI_DELIVERY}}"
    implementation "androidx.activity:activity-ktx:{{ACTIVITY_KTX}}"
    implementation "androidx.fragment:fragment-ktx:{{FRAGMENT_KTX}}"
    implementation "androidx.core:core-ktx:{{CORE_KTX}}"
    implementation "org.jetbrains.kotlinx:kotlinx-coroutines-android:{{COROUTINES}}"
}
